<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>the goat</title>
<style>
  :root {
    --bg-top: #4f9eea;
    --bg-mid: #8ec4f2;
    --bg-bottom: #dcedfb;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    cursor: default;
    position: relative;
    touch-action: none;
  }

  .sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .cloud-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
    display: flex;
    align-items: flex-start;
  }

  .cloud-layer.back {
    animation: drift 185s linear infinite;
    opacity: 0.5;
    filter: blur(5px);
  }

  .cloud-layer.mid {
    animation: drift 118s linear infinite;
    opacity: 0.72;
    filter: blur(2.5px);
  }

  .cloud-layer.front {
    animation: drift 70s linear infinite;
    opacity: 0.95;
    filter: blur(0.5px);
  }

  .cloud {
    position: absolute;
    border-radius: 50%;
    /* several soft, irregular puffs layered together read as a real
       cumulus cloud instead of a hard cartoon blob; a faint cool-grey
       gradient near the base gives it volume/underside shading; each
       cloud also bobs gently on its own cycle so the sky doesn't feel
       like a single mechanical loop */
    background:
      radial-gradient(ellipse 42% 55% at 22% 70%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 38% 60% at 46% 35%, rgba(255,255,255,1)   0%, rgba(255,255,255,0) 74%),
      radial-gradient(ellipse 46% 62% at 70% 55%, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 30% 45% at 88% 68%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 75%),
      radial-gradient(ellipse 60% 40% at 50% 78%, rgba(200,213,230,0.55) 0%, rgba(200,213,230,0) 80%);
    animation: bob var(--bob-dur, 14s) ease-in-out infinite alternate;
    animation-delay: var(--bob-delay, 0s);
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @keyframes bob {
    from { margin-top: 0; }
    to   { margin-top: var(--bob-amt, 10px); }
  }

  .cloud.small  { width: 130px; height: 70px; }
  .cloud        { width: 210px; height: 110px; }
  .cloud.large  { width: 320px; height: 160px; }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .goat-wrap {
    position: absolute;
    top: 0;
    left: 0;
    width: min(34vw, 300px);
    aspect-ratio: 557 / 441;
    will-change: transform;
  }

  .goat-img {
    display: block;
    width: 100%;
    height: 100%;
    filter: saturate(1.05) contrast(1.02);
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    /* the source photo is cropped with a hard straight edge at the
       shoulders; fade it out over the bottom ~14% so it dissolves
       into the sky instead of showing a visible cut line */
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 86%, transparent 99%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 86%, transparent 99%);
  }

  footer {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: rgba(30, 45, 70, 0.55);
    font-weight: 400;
  }

  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(30, 45, 70, 0.25);
    padding-bottom: 1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  footer a:hover {
    color: rgba(30, 45, 70, 0.9);
    border-color: rgba(30, 45, 70, 0.6);
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud-layer, .cloud { animation: none; }
  }
</style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <div class="cloud-layer back">
      <div class="cloud large" style="left: 4vw; top: 8%; --bob-dur: 17s; --bob-amt: 14px; --bob-delay: -2s;"></div>
      <div class="cloud" style="left: 34vw; top: 18%; --bob-dur: 13s; --bob-amt: 9px; --bob-delay: -6s;"></div>
      <div class="cloud small" style="left: 62vw; top: 6%; --bob-dur: 11s; --bob-amt: 7px; --bob-delay: -1s;"></div>
      <div class="cloud large" style="left: 84vw; top: 22%; --bob-dur: 19s; --bob-amt: 13px; --bob-delay: -9s;"></div>
      <div class="cloud large" style="left: 104vw; top: 8%; --bob-dur: 17s; --bob-amt: 14px; --bob-delay: -2s;"></div>
      <div class="cloud" style="left: 134vw; top: 18%; --bob-dur: 13s; --bob-amt: 9px; --bob-delay: -6s;"></div>
      <div class="cloud small" style="left: 162vw; top: 6%; --bob-dur: 11s; --bob-amt: 7px; --bob-delay: -1s;"></div>
      <div class="cloud large" style="left: 184vw; top: 22%; --bob-dur: 19s; --bob-amt: 13px; --bob-delay: -9s;"></div>
    </div>
    <div class="cloud-layer mid">
      <div class="cloud" style="left: 14vw; top: 34%; --bob-dur: 12s; --bob-amt: 8px; --bob-delay: -3s;"></div>
      <div class="cloud small" style="left: 46vw; top: 46%; --bob-dur: 10s; --bob-amt: 6px; --bob-delay: -7s;"></div>
      <div class="cloud" style="left: 76vw; top: 30%; --bob-dur: 15s; --bob-amt: 10px; --bob-delay: -4s;"></div>
      <div class="cloud small" style="left: 96vw; top: 42%; --bob-dur: 9s; --bob-amt: 6px; --bob-delay: -1s;"></div>
      <div class="cloud" style="left: 114vw; top: 34%; --bob-dur: 12s; --bob-amt: 8px; --bob-delay: -3s;"></div>
      <div class="cloud small" style="left: 146vw; top: 46%; --bob-dur: 10s; --bob-amt: 6px; --bob-delay: -7s;"></div>
      <div class="cloud" style="left: 176vw; top: 30%; --bob-dur: 15s; --bob-amt: 10px; --bob-delay: -4s;"></div>
      <div class="cloud small" style="left: 196vw; top: 42%; --bob-dur: 9s; --bob-amt: 6px; --bob-delay: -1s;"></div>
    </div>
    <div class="cloud-layer front">
      <div class="cloud small" style="left: 24vw; top: 58%; --bob-dur: 8s; --bob-amt: 6px; --bob-delay: -2s;"></div>
      <div class="cloud" style="left: 58vw; top: 65%; --bob-dur: 11s; --bob-amt: 8px; --bob-delay: -5s;"></div>
      <div class="cloud small" style="left: 90vw; top: 55%; --bob-dur: 7s; --bob-amt: 5px; --bob-delay: -1s;"></div>
      <div class="cloud small" style="left: 124vw; top: 58%; --bob-dur: 8s; --bob-amt: 6px; --bob-delay: -2s;"></div>
      <div class="cloud" style="left: 158vw; top: 65%; --bob-dur: 11s; --bob-amt: 8px; --bob-delay: -5s;"></div>
      <div class="cloud small" style="left: 190vw; top: 55%; --bob-dur: 7s; --bob-amt: 5px; --bob-delay: -1s;"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="goat-wrap" id="goatWrap">
      <img class="goat-img" src="assets/goat.png" alt="A curious goat" draggable="false" />
    </div>
  </div>

  <footer>
    <a href="mailto:Anna@thegoat.lifestyle">anna@thegoat.lifestyle</a>
  </footer>

  <script>
    const wrap = document.getElementById('goatWrap');

    const SPEED = 70; // px/sec — slow, classic screensaver pace

    let w = 0, h = 0;
    let x = 0, y = 0;
    let vx = SPEED, vy = SPEED * 0.7;
    let lastT = null;

    function measure() {
      const rect = wrap.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      const maxX = Math.max(0, window.innerWidth - w);
      const maxY = Math.max(0, window.innerHeight - h);
      x = Math.min(x, maxX);
      y = Math.min(y, maxY);
    }

    window.addEventListener('resize', measure);
    measure();
    // start somewhere other than the corner
    x = window.innerWidth * 0.5 - w / 2;
    y = window.innerHeight * 0.5 - h / 2;

    function frame(t) {
      if (lastT === null) lastT = t;
      const dt = Math.min((t - lastT) / 1000, 0.05); // clamp to avoid jumps on tab-switch
      lastT = t;

      const maxX = Math.max(0, window.innerWidth - w);
      const maxY = Math.max(0, window.innerHeight - h);

      x += vx * dt;
      y += vy * dt;

      if (x <= 0) { x = 0; vx = Math.abs(vx); }
      else if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }

      if (y <= 0) { y = 0; vy = Math.abs(vy); }
      else if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

      wrap.style.transform = `translate(${x}px, ${y}px)`;

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>

</body>
</html>
